<!doctype html>
<html><head><meta charset="utf-8"><title>CV video</title>
<style>
@font-face{font-family:G;src:url(node_modules/@fontsource/geist-sans/files/geist-sans-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:G;src:url(node_modules/@fontsource/geist-sans/files/geist-sans-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:G;src:url(node_modules/@fontsource/geist-sans/files/geist-sans-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:G;src:url(node_modules/@fontsource/geist-sans/files/geist-sans-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:GM;src:url(node_modules/@fontsource/geist-mono/files/geist-mono-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:GM;src:url(node_modules/@fontsource/geist-mono/files/geist-mono-latin-500-normal.woff2);font-weight:500}
:root{--bg:#F7F7F5;--ink:#0A0A0A;--muted:#85857F;--line:#E3E3DE;--hl:#D9F24E;--card:#FFFFFF}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:G}
body{background-image:radial-gradient(#D9D9D3 1.4px,transparent 1.6px);background-size:28px 28px;background-position:14px 14px}
.f{position:absolute;inset:0;display:none;padding:72px 80px}
.bar{display:flex;justify-content:space-between;align-items:center;font:500 22px GM;color:var(--muted)}
.bar .who{display:flex;align-items:center;gap:14px;color:var(--ink)}
.bar img{width:48px;height:48px;border-radius:50%;object-fit:cover;object-position:50% 20%}
.prog{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:34px}
.prog div{height:6px;border-radius:3px;background:var(--line)}
.prog div.on{background:var(--ink)}
.prog div.done{background:#BDBDB6}
.plabels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px;font:500 18px GM;color:var(--muted)}
.plabels .on{color:var(--ink)}
.prompt{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 26px;font:400 30px G;color:var(--ink);margin-top:60px;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.prompt .k{font:500 22px GM;color:var(--muted)}
.caret{display:inline-block;width:3px;height:34px;background:var(--ink);vertical-align:-6px;margin-left:4px}
h1{font:700 118px/.95 G;letter-spacing:-.045em;margin-top:56px}
h2{font:700 96px/.95 G;letter-spacing:-.04em}
.mark{background-image:linear-gradient(transparent 12%,var(--hl) 12%,var(--hl) 88%,transparent 88%);padding:0 .08em}
.idx{font:500 24px GM;color:var(--muted);margin-top:64px}
.years{font:500 34px GM;color:var(--ink);margin-top:14px}
.rows{margin-top:46px;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:200px 1fr;gap:24px;padding:22px 0;border-bottom:1px solid var(--line);align-items:baseline}
.row .y{font:500 24px GM;color:var(--muted)}
.row .t{font:600 38px/1.15 G;letter-spacing:-.02em}
.row .t small{display:block;font:400 26px/1.3 G;color:var(--muted);letter-spacing:0;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:38px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px}
.stat b{display:block;font:700 64px/1 G;letter-spacing:-.04em}
.stat span{display:block;font:400 22px/1.3 G;color:var(--muted);margin-top:10px}
.take{position:absolute;left:80px;right:80px;bottom:76px;font:600 40px/1.2 G;letter-spacing:-.02em;display:flex;gap:18px;align-items:baseline}
.take .k{font:500 22px GM;color:var(--muted);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:12px 22px;font:500 28px G}
.chip.now{background:var(--ink);color:#fff;border-color:var(--ink)}
.label{font:500 22px GM;color:var(--muted);margin-top:52px}
.photo{width:440px;height:550px;border-radius:28px;object-fit:cover;object-position:50% 25%;border:1px solid var(--line);display:block}
.mark{background-repeat:no-repeat;background-size:0% 100%}
#cap{position:absolute;left:80px;bottom:70px;max-width:920px;background:#0A0A0A;color:#6E6E68;border-radius:18px;padding:16px 26px 18px;font:600 38px/1.25 G;letter-spacing:-.01em;visibility:hidden;z-index:9}
#cap .k{color:#0A0A0A;background:#D9F24E;border-radius:6px;padding:0 6px}
.btn{display:inline-flex;align-items:center;gap:16px;background:var(--ink);color:#fff;border-radius:999px;padding:24px 40px;font:600 44px G;letter-spacing:-.02em}
.btn i{font-style:normal;background:var(--hl);color:var(--ink);border-radius:50%;width:56px;height:56px;display:inline-flex;align-items:center;justify-content:center;font-size:34px}
.row.sm{padding:16px 0}.row.sm .t{font-size:32px}.row.sm .t small{font-size:23px}
.stack{margin-top:26px}.stack .lab{font:500 20px GM;color:var(--muted);margin-bottom:12px}
.stack .chips{margin-top:0;gap:10px}.stack .chip{font-size:22px;padding:9px 16px}
.proj{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.proj div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;font:600 24px/1.2 G}
.proj div small{display:block;font:400 19px/1.3 G;color:var(--muted);margin-top:6px}
</style>
</head><body>
<div id="root"></div>
<div id="cap"></div>
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script src="content.js"></script>
<script src="engine.js"></script>
</body></html>
